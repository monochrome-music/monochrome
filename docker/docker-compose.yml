services:
    # Production frontend (static build served by nginx)
    monochrome:
        build:
            context: ..
            dockerfile: docker/Dockerfile
            args:
                # These must be present at BUILD time: the client config is baked
                # into the static bundle by vite-plugin-auth-gate.js.
                - AUTH_ENABLED=${AUTH_ENABLED}
                - AUTH_URL=${AUTH_URL}
                - AUTH_EMAIL_ENABLED=${AUTH_EMAIL_ENABLED}
                - AUTH_GOOGLE_ENABLED=${AUTH_GOOGLE_ENABLED}
        container_name: monochrome
        restart: unless-stopped
        # Bound to loopback so only your reverse proxy reaches it.
        # Front it with:  music.<domain> -> 127.0.0.1:4472
        ports:
            - '127.0.0.1:${MONOCHROME_PORT:-4472}:4173'
        networks:
            - monochrome-network
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4173/']
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 5s

    # Accounts / playlist-sync backend (better-auth + SQLite)
    auth:
        build:
            context: ../auth-server
        container_name: monochrome-auth
        restart: unless-stopped
        environment:
            AUTH_BASE_URL: ${AUTH_URL}
            AUTH_SECRET: ${AUTH_SECRET}
            TRUSTED_ORIGINS: ${FRONTEND_ORIGIN}
            DB_PATH: /data/auth.db
            PORT: '8080'
        volumes:
            - auth_data:/data
        # Front it with:  auth.<domain> -> 127.0.0.1:4480
        ports:
            - '127.0.0.1:${AUTH_PORT:-4480}:8080'
        networks:
            - monochrome-network
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/health']
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 5s

    # Development server -- only starts with: docker compose --profile dev up -d
    monochrome-dev:
        build:
            context: ..
            dockerfile: docker/Dockerfile.dev
        container_name: monochrome-dev
        profiles:
            - dev
        ports:
            - '${MONOCHROME_DEV_PORT:-5173}:5173'
        volumes:
            - ..:/app
            - /app/node_modules
        command: npm run dev -- --host 0.0.0.0
        networks:
            - monochrome-network

networks:
    monochrome-network:
        driver: bridge

volumes:
    auth_data:
