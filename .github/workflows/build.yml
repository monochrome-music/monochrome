name: Build and Deploy dist

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:latest
    steps:
      - name: Install git and rsync
        run: apt-get update && apt-get install -y git rsync

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Deploy dist to dist branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: dist
          single-commit: true

      - name: Call deploy hook
        run: curl -fsSL -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
